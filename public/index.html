<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Room</title><link rel="stylesheet" href="/style.css"><header><div><h1>Agent Room</h1><p>让每一个关键发现，都有所归处。</p></div><span class="badge">共享发现 · 任务空间</span></header><p id="error" role="alert" aria-live="polite"></p><section id="login"><h2>登录管理台</h2><form id="login-form"><label>部署 token<input id="token" type="password" required autocomplete="current-password" spellcheck="false"></label><button>登录</button></form></section><button id="logout" hidden>退出登录</button><main hidden><aside id="room-view"><div class="toolbar"><div><h2>任务房间</h2><p>选择一个任务，查看团队共享的发现。</p></div><button id="new-room">＋ 新建房间</button></div><div id="rooms"></div></aside><section id="detail" hidden></section></main><dialog id="room-dialog"><div class="toolbar"><h2>新建任务房间</h2><button type="button" class="secondary" id="close-room">关闭</button></div><form id="create"><label>房间名称<input name="name" required placeholder="为任务起一个清晰的名字"></label><label>任务描述<textarea name="task" required placeholder="描述目标、范围及需要解决的问题"></textarea></label><button>创建房间</button></form></dialog><script type="module" src="/app.js"></script></html>
